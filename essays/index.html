<h1 class="list-title">随笔</h1><p class="list-sub">不为什么写的那些：一件事过去之后，还想多留一会儿的部分。</p><a class="note-card" href="150%E5%BA%A6%E7%9A%84%E7%9C%BC%E9%95%9C.html">
<h3>150度的眼镜</h3><div class="meta">2026-10-09</div>
<div class="summary">国庆假期最后一天配了副眼镜，度数意料之中地低。今天戴去上班，先是欣喜，然后不太舒服——不是因为视力，是因为看到的、知道的都多了。</div><div class="tags"><span class="tag">随笔</span><span class="tag">生活</span><span class="tag">自我</span></div></a>
