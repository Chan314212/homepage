<style>
:root {
  --bg: #0d1117; --bg-soft: #161b22; --card: #1a2029;
  --text: #e6edf3; --muted: #8b949e;
  --accent: #7ee0a3; --accent-2: #58a6ff; --border: #2d333b;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8;
}
.container { max-width: 760px; margin: 0 auto; padding: 0 24px; }
.topbar { padding: 28px 0 8px; }
.topbar a {
  color: var(--accent-2); text-decoration: none; font-size: .9rem;
}
.topbar a:hover { text-decoration: underline; }
header {
  padding: 48px 0 8px;
  position: relative;
  overflow: hidden;
}
header::before {
  content: ''; position: absolute; top: -80%; right: -20%;
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(126,224,163,.10), transparent 60%);
  pointer-events: none;
}
header h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: .04em; }
header .meta { color: var(--muted); font-size: .88rem; margin-top: 10px; }
header .tags { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  font-size: .78rem; color: var(--muted);
  border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px;
}
article {
  padding: 32px 0 64px;
  color: var(--text);
  font-size: 1rem;
}
article h2 { font-size: 1.35rem; margin: 32px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
article h3 { font-size: 1.15rem; margin: 26px 0 10px; }
article h4 { font-size: 1.02rem; margin: 22px 0 8px; }
article p { margin: 12px 0; }
article a { color: var(--accent-2); text-decoration: none; }
article a:hover { text-decoration: underline; }
article ul, article ol { margin: 12px 0; padding-left: 26px; }
article li { margin: 6px 0; }
article blockquote {
  margin: 16px 0; padding: 10px 18px;
  border-left: 3px solid var(--accent);
  background: var(--bg-soft); border-radius: 0 8px 8px 0;
  color: var(--muted);
}
article code {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 2px 6px; border-radius: 5px; font-size: .88em;
}
article pre {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 16px 18px; border-radius: 10px; overflow-x: auto;
  margin: 16px 0;
}
article pre code { background: none; border: none; padding: 0; font-size: .86em; line-height: 1.6; }
article img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); margin: 12px 0; }
article table { border-collapse: collapse; margin: 16px 0; width: 100%; font-size: .92rem; }
article th, article td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
article th { background: var(--bg-soft); }
article hr { border: none; border-top: 1px solid var(--border); margin: 32px 0; }
footer {
  border-top: 1px solid var(--border);
  padding: 28px 0 56px; text-align: center;
  color: var(--muted); font-size: .85rem;
}
.filing { margin-top: 6px; }
.filing-link {
  color: var(--accent-2) !important; text-decoration: none;
  display: inline-flex; align-items: center; vertical-align: middle;
}
.filing-link:hover { color: var(--accent-2) !important; text-decoration: underline; }

/* 同栏目切换：折腾笔记 / 读书笔记 / 我的摘抄 */
.section-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
.section-nav a {
  font-size: .88rem; color: var(--muted); text-decoration: none;
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 16px;
  transition: color .2s, border-color .2s, background .2s;
}
.section-nav a:hover { color: var(--text); border-color: var(--accent-2); }
.section-nav a.active { color: var(--accent); border-color: var(--accent); background: rgba(126,224,163,.08); }

.list-title { padding: 40px 0 8px; font-size: clamp(1.8rem, 5vw, 2.4rem); }
.list-sub { color: var(--muted); font-size: .92rem; margin: 10px 0 28px; }
.note-card {
  display: block; text-decoration: none;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 20px 24px; margin-bottom: 16px;
  transition: border-color .2s, transform .2s;
}
.note-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.note-card h3 { color: var(--text); font-size: 1.08rem; }
.note-card .summary { color: var(--muted); font-size: .9rem; margin-top: 8px; }
.note-card .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
.tool-card { padding-bottom: 28px; }

/* ---- 工具页 ---- */
.status-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 18px; margin: 18px 0;
}
.dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--muted); flex: 0 0 auto;
}
body[data-state="connected"] .dot { background: var(--accent); box-shadow: 0 0 8px rgba(126,224,163,.8); }
.status-text { font-size: .92rem; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
.btn {
  font-family: inherit; font-size: .9rem; cursor: pointer;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  padding: 9px 20px; transition: border-color .2s, transform .2s, background .2s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-2px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { border-color: var(--accent); color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: rgba(126,224,163,.1); }
.btn.ghost { border-color: var(--border); color: var(--muted); }
.panel {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 10px; padding: 16px 18px; margin: 16px 0;
}
.panel h3 { font-size: .95rem; margin-bottom: 10px; color: var(--text); }
.panel pre {
  margin: 0; white-space: pre-wrap; word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .82rem; color: var(--muted); line-height: 1.7;
}
#logs {
  background: #0b0f14; border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 16px; height: 340px; overflow-y: auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .8rem; line-height: 1.65; white-space: pre-wrap; word-break: break-all;
}
#logs .info { color: #9aa4b2; }
#logs .cmd { color: #58a6ff; }
#logs .succ { color: var(--accent); }
#logs .warn { color: #e3b341; }
#logs .error { color: #f8766d; }
.cmd-input {
  display: flex; gap: 10px; margin-top: 12px;
}
.cmd-input input {
  flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: .85rem;
  background: var(--bg-soft); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
}
.cmd-input input:focus { outline: none; border-color: var(--accent-2); }
.hint { color: var(--muted); font-size: .84rem; }
details { margin: 18px 0; }
details summary {
  cursor: pointer; color: var(--accent-2); font-size: .9rem;
  padding: 6px 0; list-style: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::before { content: '▸ '; }
details[open] summary::before { content: '▾ '; }
details ol, details ul { margin: 8px 0 8px 22px; color: var(--muted); font-size: .88rem; }
details li { margin: 6px 0; }
details code { background: var(--bg-soft); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: .85em; }
</style>
</head>
